<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snell Space</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 30px;
            text-align: center;

            width: 400px;
            height: 200px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin: 0 0 2rem 0;
            color: #2c3e50;
        }

        .data {
            background-color: #eef2f3;
            padding: 1.5rem;
            border-radius: 10px;

            width: 100%;
            height: 90px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .capacity {
            font-size: 1.1rem;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
        }

        .loading {
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Snell Space Counter</h1>

    <div id="room-data" class="data">
        <div class="loading">Loading data...</div>
    </div>
</div>

<script>
    const LOCAL_ENDPOINT_HOME = "--" // Use whatever ip your internet is
    const API_URL = `http://${LOCAL_ENDPOINT_HOME}:8000/capacity/1`;
    const HISTORY_LIMIT = 10;
    const capacityHistory = [];

    async function fetchRoomData() {
        const displayElement = document.getElementById('room-data');

        try {
            // Fetch data
            const response = await fetch(API_URL);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();

            // Calculate and display room count
            const currentCapacity = Number(data.room_capacity);
            capacityHistory.push(currentCapacity);
            if (capacityHistory.length > HISTORY_LIMIT) {
                capacityHistory.shift(); // Remove the oldest entry
            }
            const sum = capacityHistory.reduce((acc, val) => acc + val, 0);
            const averageCapacity = Math.round(sum / capacityHistory.length);
            const label = averageCapacity === 1 ? "person" : "people";

            displayElement.innerHTML = `
                <div class="capacity">
                    <strong>EXPO:</strong> ${averageCapacity} ${label}
                </div>
            `;
            displayElement.style.borderColor = "#dde1e3";

        } catch (error) {
            console.error("Fetch error:", error);
            displayElement.innerHTML = `<div class="error">Could not fetch room data!</div>`;
            displayElement.style.borderColor = "#e74c3c";
        }
    }

    fetchRoomData();
    setInterval(fetchRoomData, 1000);
</script>
</body>
</html>
